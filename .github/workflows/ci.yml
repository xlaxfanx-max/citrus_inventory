name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Test
        run: python manage.py test
      - name: Build static assets
        run: python manage.py collectstatic --noinput
      - name: Deployment security checks
        env:
          DJANGO_ENV: staging
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: 'K7!mQ2@vR9#xT4$pL8&zN3*eW6-cA1_yH5+uF0=sD7?bJ2%gC9'
          DJANGO_ALLOWED_HOSTS: staging.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://staging.example.com
          SITE_URL: https://staging.example.com
          EMAIL_HOST: localhost
        run: python manage.py check --deploy --fail-level ERROR
      - name: Verify production configuration guard
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: 'K7!mQ2@vR9#xT4$pL8&zN3*eW6-cA1_yH5+uF0=sD7?bJ2%gC9'
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          set +e
          output=$(python -c "import django; django.setup()" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Production settings unexpectedly accepted missing services"
            exit 1
          fi
          echo "$output" | grep -q "Production configuration is missing"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag citrus-inventory:${{ github.sha }} .

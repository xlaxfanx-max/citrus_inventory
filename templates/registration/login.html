{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto">
  <h2 style="margin-top:0">Log in</h2>
  {% if form.errors %}<p class="flag red">Wrong username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field"><label for="id_username">Username</label><br><input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none" required style="width:100%"></div>
    <div class="field"><label for="id_password">Password</label><br><input type="password" name="password" id="id_password" autocomplete="current-password" required style="width:100%"></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn big" type="submit">Log in</button>
  </form>
  <p class="muted small">You stay logged in on this phone for 30 days.</p>
</div>
{% endblock %}
